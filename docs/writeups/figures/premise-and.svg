<text x="80" y="188" font-size="14" text-anchor="start" class="hi" font-weight="600">16 AND instructions</text>
<text x="480" y="188" font-size="14" text-anchor="start" class="hi" font-weight="600">2 AND instructions</text>
<text x="30" y="222" font-size="12" text-anchor="start" class="muted">bytes:</text>
<text x="90" y="222" font-size="12" text-anchor="start" class="fg mono" xml:space="preserve">for (x = 0; x &lt; 640; ++x) d[x] = a[x] &amp; b[x];   // 640 ANDs per VGA row</text>
<text x="30" y="242" font-size="12" text-anchor="start" class="muted">bits:</text>
<text x="90" y="242" font-size="12" text-anchor="start" class="fg mono" xml:space="preserve">for (i = 0; i &lt;  20; ++i) d[i] = a[i] &amp; b[i];   //  20 ANDs, uint32_t words</text>
<text x="30" y="268" font-size="11" text-anchor="start" class="muted">A compiler vectorizes the byte loop too, 16 or 32 bytes per instruction; the same vector registers hold eight times as many pixels as bits.</text>
