<svg xmlns="http://www.w3.org/2000/svg" width="900" height="262" viewBox="0 0 900 262" role="img" aria-label="Horizontal dilation of a packed row as two shifts and an OR, with one pixel carried across a word boundary">
<style>
.bg{fill:#ffffff}
.fg{fill:#1f2328}
.muted{fill:#59636e}
.on{fill:#2f6fdb}
