<text x="584" y="186" font-size="11" text-anchor="start" class="hi">Pi L2 ends</text>
<text x="238" y="225" font-size="13" text-anchor="end" class="fg">640×480</text>
<line x1="447.37" y1="220" x2="570.37" y2="220" class="edge"/>
<circle cx="447.4" cy="220" r="8" class="on"/>
<circle cx="570.4" cy="220" r="8" class="pad"/>
<text x="447.37" y="244" font-size="10" text-anchor="middle" class="muted mono">115,200 B</text>
<text x="570.37" y="244" font-size="10" text-anchor="middle" class="muted mono">921,600 B</text>
<text x="238" y="277" font-size="13" text-anchor="end" class="fg">1024×1024</text>
<line x1="519.98" y1="272" x2="642.98" y2="272" class="edge"/>
<circle cx="520" cy="272" r="8" class="on"/>
