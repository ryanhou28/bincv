<text x="789" y="94" font-size="12" text-anchor="start" class="fg" font-weight="600">DRAM</text>
<text x="238" y="145" font-size="13" text-anchor="end" class="fg" font-weight="600">Cortex-M7</text>
<rect x="250" y="120" width="82" height="38" class="hisoft cell"/>
<text x="256" y="144" font-size="12" text-anchor="start" class="fg" font-weight="600" xml:space="preserve">L1  16 KiB</text>
<rect x="332" y="120" width="205" height="38" class="off cell"/>
<text x="338" y="144" font-size="12" text-anchor="start" class="fg" font-weight="600" xml:space="preserve">SRAM  512 KiB</text>
<rect x="537" y="120" width="328" height="38" class="pad cell"/>
<text x="543" y="144" font-size="12" text-anchor="start" class="hi" font-weight="600">no larger RAM bank</text>
