<text x="642.98" y="296" font-size="10" text-anchor="middle" class="muted mono">3,145,728 B</text>
<text x="238" y="329" font-size="13" text-anchor="end" class="fg">8192×4096</text>
<line x1="724.98" y1="324" x2="847.98" y2="324" class="edge"/>
<circle cx="725" cy="324" r="8" class="on"/>
<circle cx="848" cy="324" r="8" class="pad"/>
<text x="724.98" y="348" font-size="10" text-anchor="middle" class="muted mono">12,582,912 B</text>
<text x="847.98" y="348" font-size="10" text-anchor="middle" class="muted mono">100,663,296 B</text>
<circle cx="250" cy="372" r="7" class="on"/>
<text x="264" y="376" font-size="12" text-anchor="start" class="fg">binCV: two input planes and the output, as bits</text>
<circle cx="250" cy="396" r="7" class="pad"/>
<text x="264" y="400" font-size="12" text-anchor="start" class="fg">OpenCV: the same three frames as bytes</text>
<text x="890" y="400" font-size="11" text-anchor="end" class="muted">log scale, 4 KiB to 128 MiB</text>
</svg>
