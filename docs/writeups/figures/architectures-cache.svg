<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Working sets of bitwiseAnd as bits and as bytes at three image sizes, on a log scale against the memory levels of a Raspberry Pi 4, an x86-64 desktop and a Cortex-M7">
<style>
.bg{fill:#ffffff}
.fg{fill:#1f2328}
.muted{fill:#59636e}
.on{fill:#2f6fdb}
.off{fill:#eef1f5}
.hi{fill:#d4620f}
.hisoft{fill:#fbe3cf}
.neg{fill:#d4620f}
.pad{fill:#d7dbe0}
.cell{stroke:#aeb6bf;stroke-width:0.75}
.word{fill:none;stroke:#1f2328;stroke-width:2}
.box{fill:none;stroke:#59636e;stroke-width:1;stroke-dasharray:3 3}
.ring{fill:none;stroke:#d4620f;stroke-width:2.5}
.edge{stroke:#59636e;stroke-width:1.25;fill:none}
.arrowhead{fill:#59636e}
.hiedge{stroke:#d4620f;stroke-width:2;fill:none}
.hiarrowhead{fill:#d4620f}
.bar1{fill:#aeb6bf}
.bar2{fill:#2f6fdb}
.s1{stroke:#2f6fdb;stroke-width:2.5;fill:none}
.s2{stroke:#d4620f;stroke-width:2.5;fill:none}
.d1{fill:#2f6fdb}
.d2{fill:#d4620f}
.gridline{stroke:#d7dbe0;stroke-width:1}
.refline{stroke:#1f2328;stroke-width:1.5;stroke-dasharray:5 4}
.axis{stroke:#59636e;stroke-width:1}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.oninv{fill:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}
.fg{fill:#e6edf3}
.muted{fill:#9198a1}
.on{fill:#4493f8}
.off{fill:#1c2129}
.hi{fill:#f0883e}
.hisoft{fill:#4a2a12}
.neg{fill:#f0883e}
.pad{fill:#3d444d}
.cell{stroke:#3d444d}
.word{stroke:#e6edf3}
.box{stroke:#9198a1}
.ring{stroke:#f0883e}
.edge{stroke:#9198a1}
.arrowhead{fill:#9198a1}
.hiedge{stroke:#f0883e}
.hiarrowhead{fill:#f0883e}
.bar1{fill:#59636e}
.bar2{fill:#4493f8}
.s1{stroke:#4493f8}
.s2{stroke:#f0883e}
.d1{fill:#4493f8}
.d2{fill:#f0883e}
.gridline{stroke:#30363d}
.refline{stroke:#e6edf3}
.axis{stroke:#9198a1}
.halo{stroke:#0d1117}
.oninv{fill:#0d1117}
}
</style>
<rect width="100%%" height="100%%" class="bg" rx="8"/>
<text x="238" y="45" font-size="13" text-anchor="end" class="fg" font-weight="600">Raspberry Pi 4</text>
<rect x="250" y="20" width="123" height="38" class="hisoft cell"/>
<text x="256" y="44" font-size="12" text-anchor="start" class="fg" font-weight="600" xml:space="preserve">L1  32 KiB</text>
<rect x="373" y="20" width="205" height="38" class="off cell"/>
<text x="379" y="44" font-size="12" text-anchor="start" class="fg" font-weight="600" xml:space="preserve">L2  1 MiB</text>
<rect x="578" y="20" width="287" height="38" class="bg cell"/>
<text x="584" y="44" font-size="12" text-anchor="start" class="fg" font-weight="600">DRAM</text>
<text x="238" y="95" font-size="13" text-anchor="end" class="fg" font-weight="600">x86-64 desktop</text>
<rect x="250" y="70" width="123" height="38" class="hisoft cell"/>
<text x="256" y="94" font-size="12" text-anchor="start" class="fg" font-weight="600" xml:space="preserve">L1  32 KiB</text>
<rect x="373" y="70" width="164" height="38" class="off cell"/>
<text x="379" y="94" font-size="12" text-anchor="start" class="fg" font-weight="600" xml:space="preserve">L2  512 KiB</text>
