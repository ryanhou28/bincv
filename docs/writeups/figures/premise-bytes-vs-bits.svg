<text x="536" y="224" font-size="13" text-anchor="start" class="fg">pixel x is bit x mod W of word x / W</text>
<text x="536" y="244" font-size="13" text-anchor="start" class="fg mono">as a number: 0b11111100 = 0xFC</text>
<text x="536" y="262" font-size="12" text-anchor="start" class="muted">pixel 0 is the least significant bit,</text>
<text x="536" y="278" font-size="12" text-anchor="start" class="muted">so written as a number the row reads backwards</text>
<text x="30" y="318" font-size="11" text-anchor="start" class="muted">Drawn with 8-bit words for legibility; the default word is uint32_t, 32 pixels.</text>
