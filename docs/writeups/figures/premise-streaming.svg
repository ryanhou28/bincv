<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="A dense stereo cost volume holds a cost for every pixel at every disparity; binCV streams a band of rows through per-disparity running sums and emits the map row by row">
<style>
.bg{fill:#ffffff}
.fg{fill:#1f2328}
.muted{fill:#59636e}
.on{fill:#2f6fdb}
.off{fill:#eef1f5}
.hi{fill:#d4620f}
.hisoft{fill:#fbe3cf}
.neg{fill:#d4620f}
.pad{fill:#d7dbe0}
.cell{stroke:#aeb6bf;stroke-width:0.75}
.word{fill:none;stroke:#1f2328;stroke-width:2}
.box{fill:none;stroke:#59636e;stroke-width:1;stroke-dasharray:3 3}
.ring{fill:none;stroke:#d4620f;stroke-width:2.5}
.edge{stroke:#59636e;stroke-width:1.25;fill:none}
.arrowhead{fill:#59636e}
.hiedge{stroke:#d4620f;stroke-width:2;fill:none}
.hiarrowhead{fill:#d4620f}
.bar1{fill:#aeb6bf}
.bar2{fill:#2f6fdb}
.s1{stroke:#2f6fdb;stroke-width:2.5;fill:none}
.s2{stroke:#d4620f;stroke-width:2.5;fill:none}
.d1{fill:#2f6fdb}
.d2{fill:#d4620f}
.gridline{stroke:#d7dbe0;stroke-width:1}
.refline{stroke:#1f2328;stroke-width:1.5;stroke-dasharray:5 4}
.axis{stroke:#59636e;stroke-width:1}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.oninv{fill:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}
.fg{fill:#e6edf3}
.muted{fill:#9198a1}
.on{fill:#4493f8}
.off{fill:#1c2129}
.hi{fill:#f0883e}
.hisoft{fill:#4a2a12}
.neg{fill:#f0883e}
.pad{fill:#3d444d}
.cell{stroke:#3d444d}
.word{stroke:#e6edf3}
.box{stroke:#9198a1}
.ring{stroke:#f0883e}
.edge{stroke:#9198a1}
.arrowhead{fill:#9198a1}
.hiedge{stroke:#f0883e}
.hiarrowhead{fill:#f0883e}
.bar1{fill:#59636e}
.bar2{fill:#4493f8}
.s1{stroke:#4493f8}
.s2{stroke:#f0883e}
.d1{fill:#4493f8}
.d2{fill:#f0883e}
.gridline{stroke:#30363d}
.refline{stroke:#e6edf3}
.axis{stroke:#9198a1}
.halo{stroke:#0d1117}
.oninv{fill:#0d1117}
}
</style>
<rect width="100%%" height="100%%" class="bg" rx="8"/>
<text x="30" y="26" font-size="14" text-anchor="start" class="fg" font-weight="600">Cost volume: every pixel at every disparity</text>
<rect x="180" y="50" width="220" height="140" class="pad cell"/>
<rect x="166" y="54" width="220" height="140" class="pad cell"/>
<rect x="152" y="58" width="220" height="140" class="pad cell"/>
<rect x="138" y="62" width="220" height="140" class="pad cell"/>
<rect x="124" y="66" width="220" height="140" class="pad cell"/>
<rect x="110" y="70" width="220" height="140" class="pad cell"/>
<rect x="96" y="74" width="220" height="140" class="pad cell"/>
<rect x="82" y="78" width="220" height="140" class="pad cell"/>
<rect x="68" y="82" width="220" height="140" class="pad cell"/>
<rect x="54" y="86" width="220" height="140" class="pad cell"/>
<rect x="40" y="90" width="220" height="140" class="off cell"/>
<text x="40" y="260" font-size="12" text-anchor="start" class="muted">width × height × disparities, all resident</text>
<text x="40" y="280" font-size="12" text-anchor="start" class="muted">before any pixel picks its disparity</text>
<text x="470" y="26" font-size="14" text-anchor="start" class="fg" font-weight="600">binCV: a band of rows, streamed</text>
<rect x="470" y="50" width="170" height="200" class="off cell"/>
<rect x="470" y="120" width="170" height="36" class="on cell"/>
<text x="555" y="143" font-size="12" text-anchor="middle" class="oninv">window rows</text>
<line x1="555" y1="172" x2="555" y2="193" class="edge"/>
<path d="M555 200L551 193L559 193Z" class="arrowhead"/>
<text x="555" y="268" font-size="12" text-anchor="middle" class="muted">image pair, as bits</text>
<text x="680" y="60" font-size="12" text-anchor="start" class="fg">per disparity:</text>
<text x="680" y="78" font-size="12" text-anchor="start" class="fg">a running window sum</text>
<rect x="680" y="92" width="16" height="46" class="hisoft cell"/>
<rect x="702" y="92" width="16" height="46" class="hisoft cell"/>
<rect x="724" y="92" width="16" height="46" class="hisoft cell"/>
<rect x="746" y="92" width="16" height="46" class="hisoft cell"/>
<rect x="768" y="92" width="16" height="46" class="hisoft cell"/>
<rect x="790" y="92" width="16" height="46" class="hisoft cell"/>
<rect x="812" y="92" width="16" height="46" class="hisoft cell"/>
<rect x="834" y="92" width="16" height="46" class="hisoft cell"/>
<text x="680" y="160" font-size="12" text-anchor="start" class="muted">add the entering row,</text>
<text x="680" y="177" font-size="12" text-anchor="start" class="muted">drop the leaving one</text>
<line x1="645" y1="138" x2="668.52" y2="119.35" class="edge"/>
<path d="M674 115L671 122.48L666.03 116.22Z" class="arrowhead"/>
<rect x="680" y="200" width="176" height="24" class="on cell"/>
<text x="768" y="217" font-size="11" text-anchor="middle" class="oninv">best disparity, this row</text>
<line x1="848" y1="142" x2="848" y2="189" class="edge"/>
<path d="M848 196L844 189L852 189Z" class="arrowhead"/>
<text x="680" y="250" font-size="12" text-anchor="start" class="muted">emitted, then the memory</text>
<text x="680" y="267" font-size="12" text-anchor="start" class="muted">is reused for the next row</text>
<text x="30" y="316" font-size="11" text-anchor="start" class="muted">Nothing outlives a row except its answer, so the scratch depends on the width and the disparity range, not the image height.</text>
</svg>
