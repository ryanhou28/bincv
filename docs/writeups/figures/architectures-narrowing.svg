<svg xmlns="http://www.w3.org/2000/svg" width="900" height="236" viewBox="0 0 900 236" role="img" aria-label="On a little-endian machine a 64-bit bit-plane row is byte-identical to a 32-bit row with twice as many words, so it can be read as one without a copy">
<style>
.bg{fill:#ffffff}
.fg{fill:#1f2328}
.muted{fill:#59636e}
.on{fill:#2f6fdb}
.off{fill:#eef1f5}
.hi{fill:#d4620f}
.hisoft{fill:#fbe3cf}
.neg{fill:#d4620f}
.pad{fill:#d7dbe0}
.cell{stroke:#aeb6bf;stroke-width:0.75}
.word{fill:none;stroke:#1f2328;stroke-width:2}
.box{fill:none;stroke:#59636e;stroke-width:1;stroke-dasharray:3 3}
.ring{fill:none;stroke:#d4620f;stroke-width:2.5}
.edge{stroke:#59636e;stroke-width:1.25;fill:none}
.arrowhead{fill:#59636e}
.hiedge{stroke:#d4620f;stroke-width:2;fill:none}
.hiarrowhead{fill:#d4620f}
.bar1{fill:#aeb6bf}
.bar2{fill:#2f6fdb}
.s1{stroke:#2f6fdb;stroke-width:2.5;fill:none}
.s2{stroke:#d4620f;stroke-width:2.5;fill:none}
.d1{fill:#2f6fdb}
.d2{fill:#d4620f}
.gridline{stroke:#d7dbe0;stroke-width:1}
.refline{stroke:#1f2328;stroke-width:1.5;stroke-dasharray:5 4}
.axis{stroke:#59636e;stroke-width:1}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.oninv{fill:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}
.fg{fill:#e6edf3}
.muted{fill:#9198a1}
.on{fill:#4493f8}
.off{fill:#1c2129}
.hi{fill:#f0883e}
.hisoft{fill:#4a2a12}
.neg{fill:#f0883e}
.pad{fill:#3d444d}
.cell{stroke:#3d444d}
.word{stroke:#e6edf3}
.box{stroke:#9198a1}
.ring{stroke:#f0883e}
.edge{stroke:#9198a1}
.arrowhead{fill:#9198a1}
.hiedge{stroke:#f0883e}
.hiarrowhead{fill:#f0883e}
.bar1{fill:#59636e}
.bar2{fill:#4493f8}
.s1{stroke:#4493f8}
.s2{stroke:#f0883e}
.d1{fill:#4493f8}
.d2{fill:#f0883e}
.gridline{stroke:#30363d}
.refline{stroke:#e6edf3}
.axis{stroke:#9198a1}
.halo{stroke:#0d1117}
.oninv{fill:#0d1117}
}
</style>
<rect width="100%%" height="100%%" class="bg" rx="8"/>
<text x="136" y="60" font-size="13" text-anchor="end" class="fg">bytes in memory</text>
<rect x="150" y="40" width="74" height="30" class="off cell"/>
<text x="187" y="53" font-size="11" text-anchor="middle" class="fg">byte 0</text>
<text x="187" y="66" font-size="10" text-anchor="middle" class="muted mono">px 0–7</text>
<rect x="224" y="40" width="74" height="30" class="off cell"/>
<text x="261" y="53" font-size="11" text-anchor="middle" class="fg">byte 1</text>
<text x="261" y="66" font-size="10" text-anchor="middle" class="muted mono">px 8–15</text>
<rect x="298" y="40" width="74" height="30" class="off cell"/>
<text x="335" y="53" font-size="11" text-anchor="middle" class="fg">byte 2</text>
<text x="335" y="66" font-size="10" text-anchor="middle" class="muted mono">px 16–23</text>
<rect x="372" y="40" width="74" height="30" class="off cell"/>
<text x="409" y="53" font-size="11" text-anchor="middle" class="fg">byte 3</text>
<text x="409" y="66" font-size="10" text-anchor="middle" class="muted mono">px 24–31</text>
<rect x="446" y="40" width="74" height="30" class="off cell"/>
<text x="483" y="53" font-size="11" text-anchor="middle" class="fg">byte 4</text>
<text x="483" y="66" font-size="10" text-anchor="middle" class="muted mono">px 32–39</text>
<rect x="520" y="40" width="74" height="30" class="off cell"/>
<text x="557" y="53" font-size="11" text-anchor="middle" class="fg">byte 5</text>
<text x="557" y="66" font-size="10" text-anchor="middle" class="muted mono">px 40–47</text>
<rect x="594" y="40" width="74" height="30" class="off cell"/>
<text x="631" y="53" font-size="11" text-anchor="middle" class="fg">byte 6</text>
<text x="631" y="66" font-size="10" text-anchor="middle" class="muted mono">px 48–55</text>
<rect x="668" y="40" width="74" height="30" class="off cell"/>
<text x="705" y="53" font-size="11" text-anchor="middle" class="fg">byte 7</text>
<text x="705" y="66" font-size="10" text-anchor="middle" class="muted mono">px 56–63</text>
<text x="136" y="120" font-size="13" text-anchor="end" class="fg">one uint64_t</text>
<rect x="150" y="102" width="592" height="28" class="on cell"/>
<text x="446" y="120" font-size="12" text-anchor="middle" class="oninv mono">bits 0–63 = pixels 0–63</text>
<text x="136" y="168" font-size="13" text-anchor="end" class="fg">two uint32_t</text>
<rect x="150" y="150" width="296" height="28" class="on cell"/>
<rect x="150" y="150" width="296" height="28" class="word"/>
<text x="298" y="168" font-size="12" text-anchor="middle" class="oninv mono">word 0: pixels 0–31</text>
<rect x="446" y="150" width="296" height="28" class="on cell"/>
<rect x="446" y="150" width="296" height="28" class="word"/>
<text x="594" y="168" font-size="12" text-anchor="middle" class="oninv mono">word 1: pixels 32–63</text>
<text x="758" y="120" font-size="12" text-anchor="start" class="muted">stride S words</text>
<text x="758" y="168" font-size="12" text-anchor="start" class="muted">stride 2S words</text>
<text x="30" y="206" font-size="11" text-anchor="start" class="muted">Pixel x is bit x of the row either way, because the low byte comes first. narrowPlane reinterprets the view; nothing is copied or allocated.</text>
</svg>
