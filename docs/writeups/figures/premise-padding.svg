<svg xmlns="http://www.w3.org/2000/svg" width="900" height="214" viewBox="0 0 900 214" role="img" aria-label="A 13-pixel row in two 8-bit words; a word-wise NOT without the tail mask sets the three padding bits, which a later count reads as pixels">
