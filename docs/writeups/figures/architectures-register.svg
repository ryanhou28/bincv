<rect x="270" y="150" width="512" height="26" class="word"/>
<text x="794" y="167" font-size="13" text-anchor="start" class="fg" font-weight="600">256 pixels</text>
<text x="270" y="198" font-size="11" text-anchor="start" class="muted">bits →</text>
<text x="30" y="226" font-size="11" text-anchor="start" class="muted">Width drawn to scale in bits. Packing alone only matches a byte vector: a scalar word of bits holds exactly what an AVX2</text>
<text x="30" y="242" font-size="11" text-anchor="start" class="muted">register of bytes holds. The advantage appears when the bit-level logic also runs across the whole vector register.</text>
</svg>
