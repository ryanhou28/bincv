<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-label="The box-filter downsample against cv::pyrDown across bit depths: binCV stays ahead through 4 bits on the Cortex-A72 and is behind at every equal-width depth on x86-64">
