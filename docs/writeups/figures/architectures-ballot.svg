<text x="88" y="138" font-size="11" text-anchor="end" class="muted">word</text>
<text x="30" y="172" font-size="11" text-anchor="start" class="muted">Lane i sets bit i, which is exactly where the format stores pixel i, so a warp packs a 32-pixel word of the host's own layout</text>
<text x="30" y="188" font-size="11" text-anchor="start" class="muted">in one step. That is why the device word is uint32_t: it is both the integer width and the width of the hardware's own primitives.</text>
