<svg xmlns="http://www.w3.org/2000/svg" width="900" height="262" viewBox="0 0 900 262" role="img" aria-label="A 2 by 2 box over a 1-bit image: each block counts 0 to 4, rescaled to a 3-bit value stored as three planes">
<style>
