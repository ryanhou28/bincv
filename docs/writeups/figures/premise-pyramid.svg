<rect x="740" y="168" width="18" height="18" class="on cell"/>
<rect x="758" y="168" width="18" height="18" class="on cell"/>
<rect x="704" y="150" width="18" height="18" class="ring"/>
<text x="786" y="172" font-size="11" text-anchor="start" class="muted">plane 2</text>
<text x="30" y="194" font-size="12" text-anchor="start" class="fg">value = round(count × 7 / 4): the five counts 0, 1, 2, 3, 4 become 0, 2, 4, 5, 7, so white stays white at full scale.</text>
<text x="30" y="216" font-size="11" text-anchor="start" class="muted">The count is a bit-sliced sum of four 1-bit inputs, so it is word-parallel like the adder; the rescale is a comparison against constants.</text>
<text x="30" y="234" font-size="11" text-anchor="start" class="muted">Row pairs are read by index, so the vertical half of the downsample moves no bits; the horizontal half is a word-local unshuffle.</text>
</svg>
