<text x="786" y="122" font-size="11" text-anchor="start" class="muted">plane 1</text>
<rect x="704" y="150" width="18" height="18" class="on cell"/>
<rect x="722" y="150" width="18" height="18" class="off cell"/>
<rect x="740" y="150" width="18" height="18" class="off cell"/>
